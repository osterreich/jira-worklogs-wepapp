<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jira Worklogs</title>
  <link rel="icon" type="image/png" href="/jira.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/40 to-cyan-50/50 text-slate-900">
  <div class="mx-auto max-w-7xl px-6 py-10">
    <div class="rounded-2xl border border-indigo-100 bg-white/95 p-6 shadow-xl shadow-indigo-100/50">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h1 class="bg-gradient-to-r from-indigo-700 via-violet-600 to-cyan-600 bg-clip-text text-2xl font-semibold tracking-tight text-transparent">Jira Worklogs</h1>
          <p class="mt-1 text-sm text-slate-600">Select a date range and fetch your worklog totals.</p>
        </div>
        <div class="rounded-full border border-indigo-100 bg-indigo-50 px-3 py-1 text-xs font-medium text-indigo-600">Worklog analytics</div>
      </div>

      <form id="form" class="mt-6 grid gap-4 sm:grid-cols-2">
        <div>
          <label for="from" class="block text-xs font-medium text-slate-600">From</label>
          <input id="from" name="from" type="date" required class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-slate-400 focus:outline-none" />
        </div>
        <div>
          <label for="to" class="block text-xs font-medium text-slate-600">To</label>
          <input id="to" name="to" type="date" required class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-slate-400 focus:outline-none" />
        </div>
        <div>
          <label for="project" class="block text-xs font-medium text-slate-600">Project key (optional)</label>
          <input id="project" name="project" type="text" placeholder="PT" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-slate-400 focus:outline-none" />
        </div>
        <div class="flex items-center gap-2 pt-6">
          <input id="perIssue" name="perIssue" type="checkbox" checked class="h-4 w-4 rounded border-slate-300 text-slate-900" />
          <label for="perIssue" class="text-sm text-slate-700">Show per-issue breakdown</label>
        </div>
        <div class="sm:col-span-2">
          <button type="submit" class="w-full rounded-lg bg-gradient-to-r from-indigo-600 via-violet-600 to-cyan-600 px-4 py-2 text-sm font-semibold text-white shadow-md shadow-indigo-200 transition hover:from-indigo-700 hover:via-violet-700 hover:to-cyan-700">Fetch</button>
        </div>
      </form>

      <div class="mt-6">
        <div class="text-xs text-slate-500">Result</div>
        <div id="result" class="mt-2 min-h-[110px] rounded-xl border border-indigo-100 bg-gradient-to-br from-indigo-50 via-white to-cyan-50 p-4 text-sm text-slate-800">Ready.</div>
        <div id="meta" class="mt-2 text-xs text-slate-500"></div>
      </div>

      <div id="dashboard" class="mt-6 hidden grid items-stretch gap-6 lg:grid-cols-[minmax(0,2fr)_minmax(360px,1fr)]">
      <div id="chartCard" class="hidden flex flex-col overflow-hidden rounded-xl border border-indigo-100 bg-white p-4 shadow-sm lg:col-span-2 lg:h-[620px]">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 class="text-sm font-semibold text-indigo-950">Hours per day</h2>
            <p class="mt-1 text-xs text-slate-500">Your logged time for each day in the selected range.</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="exportCsv" type="button" class="hidden rounded-lg bg-emerald-500 px-3 py-1.5 text-xs font-semibold text-white shadow-sm transition hover:bg-emerald-600">Export CSV</button>
          </div>
        </div>
        <div id="monthSummary" class="mt-4 flex flex-wrap gap-2"></div>
        <div id="chartContainer" class="mt-4 min-h-[240px]">
          <canvas id="worklogChart" aria-label="Hours per day" role="img"></canvas>
        </div>
        <div id="chartEmpty" class="hidden py-16 text-center text-sm text-slate-500">No data for this range.</div>
      </div>

      <div id="issuesCard" class="hidden flex flex-col overflow-hidden rounded-xl border border-violet-100 bg-white p-4 shadow-sm lg:h-[620px]">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 class="text-sm font-semibold text-violet-950">Issues</h2>
            <p class="mt-1 text-xs text-slate-500">Logged time by Jira issue.</p>
          </div>
          <span class="rounded-full bg-violet-50 px-2.5 py-1 text-xs font-medium text-violet-700">Sorted by key</span>
        </div>
        <div id="issueList" class="mt-4 min-h-0 flex-1 overflow-y-auto pr-1"></div>
      </div>
      </div>
    </div>
  </div>

  <script src="/vendor/chart.js/chart.umd.js"></script>
  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const meta = document.getElementById("meta");
    const dashboard = document.getElementById("dashboard");
    const chartCard = document.getElementById("chartCard");
    const issuesCard = document.getElementById("issuesCard");
    const issueList = document.getElementById("issueList");
    const chartContainer = document.getElementById("chartContainer");
    const chartEmpty = document.getElementById("chartEmpty");
    const chartCanvas = document.getElementById("worklogChart");
    const monthSummary = document.getElementById("monthSummary");
    const exportCsvButton = document.getElementById("exportCsv");
    let worklogChart = null;
    let latestWorklogEntries = [];

    function dateInputValue(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    const today = new Date();
    const defaultFrom = dateInputValue(
      new Date(today.getFullYear(), today.getMonth(), 1)
    );
    const defaultTo = dateInputValue(
      new Date(today.getFullYear(), today.getMonth() + 1, 0)
    );
    document.getElementById("from").value = defaultFrom;
    document.getElementById("to").value = defaultTo;

    let jiraBase = "";
    fetch("/api/config")
      .then((r) => r.json())
      .then((cfg) => {
        jiraBase = String(cfg.jiraBase || "");
      })
      .catch(() => {
        jiraBase = "";
      });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function exportCsv() {
      if (latestWorklogEntries.length === 0) return;

      const rows = [
        ["Issue key", "Issue name", "Issue URL", "Full datetime", "Date", "Hours"],
        ...latestWorklogEntries.map((item) => [
          item.issueKey,
          item.issueName,
          jiraBase ? `${jiraBase}/browse/${item.issueKey}` : "",
          item.datetime,
          item.date,
          item.hours,
        ]),
      ];
      const csv = "\uFEFF" + rows.map((row) => row.map(csvCell).join(",")).join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `jira-worklogs-${dateInputValue(new Date())}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function formatOutputHtml(data) {
      const parts = [];
      parts.push(
        "<div>Range: " +
          escapeHtml(data.range.from) +
          " .. " +
          escapeHtml(data.range.to) +
          "</div>"
      );
      parts.push(
        "<div>Issues matched by JQL: " +
          escapeHtml(data.issueCount) +
          "</div>"
      );
      parts.push(
        "<div>Total: " +
          escapeHtml(data.totalSeconds) +
          " seconds (" +
          escapeHtml(data.totalHours) +
          " hours)</div>"
      );

      return parts.join("");
    }

    function formatMonthLabel(monthKey) {
      const [year, month] = monthKey.split("-").map(Number);
      return new Date(year, month - 1, 1).toLocaleDateString(undefined, {
        month: "long",
        year: "numeric",
      });
    }

    function renderMonthSummary(items) {
      const totals = new Map();
      for (const item of items) {
        const monthKey = String(item.date).slice(0, 7);
        totals.set(monthKey, (totals.get(monthKey) || 0) + Number(item.hours || 0));
      }

      monthSummary.innerHTML = [...totals.entries()].map(([monthKey, hours]) => (
        "<span class=\"rounded-lg border border-violet-100 bg-gradient-to-r from-violet-50 to-cyan-50 px-3 py-1.5 text-xs text-slate-700\">" +
        "<span class=\"font-semibold text-violet-700\">" +
        escapeHtml(formatMonthLabel(monthKey)) +
        "</span> · " +
        "<span class=\"font-semibold text-cyan-700\">" +
        escapeHtml(Number(hours.toFixed(2))) +
        "h</span></span>"
      )).join("");
    }

    const monthDividerPlugin = {
      id: "monthDivider",
      afterDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        const labels = chart.data.labels || [];
        if (!labels.length || !scales.x) return;

        ctx.save();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = "rgba(124, 58, 237, 0.35)";
        ctx.fillStyle = "rgb(109, 40, 217)";
        ctx.font = "600 11px sans-serif";

        labels.forEach((label, index) => {
          const monthKey = String(label).slice(0, 7);
          const previousMonthKey = index > 0
            ? String(labels[index - 1]).slice(0, 7)
            : null;
          if (monthKey === previousMonthKey) return;

          const currentX = scales.x.getPixelForValue(index);
          const previousX = index > 0 ? scales.x.getPixelForValue(index - 1) : currentX;
          const dividerX = index > 0 ? (previousX + currentX) / 2 : chartArea.left;

          if (index > 0) {
            ctx.beginPath();
            ctx.moveTo(dividerX, chartArea.top);
            ctx.lineTo(dividerX, chartArea.bottom);
            ctx.stroke();
          }

          ctx.fillText(formatMonthLabel(monthKey), dividerX + 6, chartArea.top - 6);
        });
        ctx.restore();
      },
    };

    function renderIssues(data, perIssue) {
      if (!perIssue) {
        issuesCard.classList.add("hidden");
        chartCard.classList.add("lg:col-span-2");
        return;
      }

      issuesCard.classList.remove("hidden");
      chartCard.classList.remove("lg:col-span-2");
      const items = Array.isArray(data.perIssue) ? data.perIssue : [];
      if (items.length === 0) {
        issueList.innerHTML = "<div class=\"rounded-lg bg-slate-50 p-4 text-sm text-slate-500\">No issues for this range.</div>";
        return;
      }

      issueList.innerHTML = "<ul class=\"space-y-2\">" + items.map((item) => {
        const key = String(item.key || "");
        const href = jiraBase ? jiraBase + "/browse/" + key : "#";
        return (
          "<li class=\"flex items-start justify-between gap-3 rounded-lg border border-slate-100 bg-gradient-to-r from-violet-50/70 to-cyan-50/60 px-3 py-2\">" +
          "<div class=\"min-w-0\">" +
          "<a class=\"font-semibold text-indigo-700 underline decoration-indigo-200 underline-offset-2 hover:text-violet-700\" href=\"" +
          escapeHtml(href) +
          "\" target=\"_blank\" rel=\"noopener noreferrer\">" +
          escapeHtml(key) +
          "</a>" +
          "<div class=\"truncate text-xs text-slate-600\" title=\"" + escapeHtml(item.name || "Без названия") + "\">" +
          escapeHtml(item.name || "Без названия") +
          "</div></div>" +
          "<span class=\"shrink-0 rounded-full bg-white px-2 py-1 text-xs font-semibold text-violet-700 shadow-sm\">" +
          escapeHtml(item.hours) +
          "h</span></li>"
        );
      }).join("") + "</ul>";
    }

    function resetChart() {
      if (worklogChart) {
        worklogChart.destroy();
        worklogChart = null;
      }
      chartCard.classList.add("hidden");
      chartContainer.classList.remove("hidden");
      chartEmpty.classList.add("hidden");
      monthSummary.innerHTML = "";
      exportCsvButton.classList.add("hidden");
      latestWorklogEntries = [];
    }

    function resetDashboard() {
      resetChart();
      dashboard.classList.add("hidden");
      issuesCard.classList.add("hidden");
    }

    function renderChart(data) {
      resetChart();
      dashboard.classList.remove("hidden");
      chartCard.classList.remove("hidden");
      const items = Array.isArray(data.perDay) ? data.perDay : [];
      if (items.length === 0) {
        chartContainer.classList.add("hidden");
        chartEmpty.classList.remove("hidden");
        return;
      }

      chartContainer.style.height = "440px";
      latestWorklogEntries = Array.isArray(data.worklogEntries)
        ? data.worklogEntries
        : [];
      exportCsvButton.classList.remove("hidden");
      renderMonthSummary(items);
      worklogChart = new Chart(chartCanvas, {
        type: "line",
        data: {
          labels: items.map((item) => item.date),
          datasets: [{
            label: "Hours",
            data: items.map((item) => item.hours),
            backgroundColor: "rgba(99, 102, 241, 0.14)",
            borderColor: "rgb(79, 70, 229)",
            borderWidth: 2,
            fill: true,
            tension: 0.25,
            pointRadius: 2,
            pointHoverRadius: 5,
            pointBackgroundColor: "rgb(6, 182, 212)",
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 24, right: 8 } },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (context) => `${context.parsed.y} hours`,
              },
            },
          },
          scales: {
            x: {
              title: { display: true, text: "Date" },
              ticks: {
                autoSkip: true,
                maxTicksLimit: 16,
                maxRotation: 45,
                minRotation: 45,
              },
              grid: { color: "rgba(148, 163, 184, 0.2)" },
            },
            y: {
              beginAtZero: true,
              title: { display: true, text: "Hours" },
              ticks: { precision: 2 },
              grid: { color: "rgba(148, 163, 184, 0.2)" },
            },
          },
        },
        plugins: [monthDividerPlugin],
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      result.textContent = "Loading...";
      meta.textContent = "";
      resetDashboard();

      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const project = document.getElementById("project").value.trim();
      const perIssue = document.getElementById("perIssue").checked;

      const params = new URLSearchParams({ from, to });
      if (project) params.set("project", project);
      params.set("perIssue", "1");

      try {
        const res = await fetch("/api/worklogs?" + params.toString());
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data?.error || "Request failed");
        }
        result.innerHTML = formatOutputHtml(data);
        renderIssues(data, perIssue);
        renderChart(data);
        meta.textContent = "Fetched at " + new Date().toLocaleTimeString();
      } catch (err) {
        result.textContent = "Error: " + err.message;
      }
    });

    exportCsvButton.addEventListener("click", exportCsv);
  </script>
</body>
</html>
